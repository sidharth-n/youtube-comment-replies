<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ravichandran Reply Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Noto+Sans+Malayalam:wght@400;600&family=Noto+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a ledger. Summary strip on top, then one row per reply: their comment on the left, our answer on the right. Stacks on phones. */
:root {
  --bg: #f6f8f4;        /* paper with a faint leaf tint */
  --surface: #ffffff;
  --fg: #1c241d;
  --muted: #5d6b5f;
  --line: #dde5db;
  --accent: #2f6b3a;    /* curry-leaf green */
  --accent-soft: #e4efe2;
  --hand: #8a5a12;      /* turmeric, marks hand-written replies */
  --hand-soft: #f6ead3;
  --display: "Bricolage Grotesque", "Noto Sans", system-ui, sans-serif;
  --body: "Noto Sans", "Noto Sans Malayalam", system-ui, sans-serif;
  --ml: "Noto Sans Malayalam", "Noto Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121712; --surface: #1a211b; --fg: #e3eae2; --muted: #9aa99b; --line: #2b352c;
  --accent: #86c592; --accent-soft: #1f3323; --hand: #e3b766; --hand-soft: #3a2e17; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121712; --surface: #1a211b; --fg: #e3eae2; --muted: #9aa99b; --line: #2b352c;
  --accent: #86c592; --accent-soft: #1f3323; --hand: #e3b766; --hand-soft: #3a2e17; color-scheme: dark }

* { box-sizing: border-box }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body) }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px }

header { display: grid; gap: 6px }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent) }
h1 { font: 700 clamp(28px, 5vw, 42px)/1.1 var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em }
.sub { color: var(--muted); margin: 0 }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.stat { background: var(--surface); padding: 16px 18px; display: grid; gap: 2px }
.stat b { font: 700 30px/1.1 var(--display); font-variant-numeric: tabular-nums }
.stat span { color: var(--muted); font-size: 13px }
.stat.hand b { color: var(--hand) }

.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface) }
.seg button { font: 600 13px/1 var(--body); color: var(--muted); background: none; border: 0; padding: 8px 14px;
  border-radius: 999px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg) }
.seg button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input[type="search"] { flex: 1 1 220px; min-width: 0; font: 15px var(--body); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px }
.count { font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }

.log { display: grid; border-top: 1px solid var(--line) }
.row { display: grid; grid-template-columns: 120px minmax(0, 1fr) minmax(0, 1.25fr); gap: 20px;
  padding-block: 18px; border-bottom: 1px solid var(--line) }
.when { font: 13px/1.5 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; display: grid; gap: 6px; align-content: start }
.pill { justify-self: start; font: 600 11px/1 var(--body); letter-spacing: .04em; text-transform: uppercase;
  padding: 5px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent) }
.pill.hand { background: var(--hand-soft); color: var(--hand) }
.who { font-weight: 600; font-size: 14px; overflow-wrap: anywhere }
.vid { color: var(--muted); font-size: 12px }
.text { font-family: var(--ml); white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0 0 }
.reply { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; align-content: start }
.reply .text { margin: 0 }
.reply a { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 600; justify-self: start }
.reply a:hover { text-decoration: underline }
.empty { padding: 40px 0; color: var(--muted); text-align: center }

@media (max-width: 760px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .row { grid-template-columns: minmax(0, 1fr); gap: 10px }
  .when { grid-auto-flow: column; justify-content: start; align-items: center; gap: 10px }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">YouTube · Ravichandran</div>
    <h1>Reply log</h1>
    <p class="sub">Every reply the channel has posted, beside the comment it answered. Updated __STAMP__.</p>
  </header>

  <section class="stats" aria-label="Summary">
    <div class="stat"><b id="s-total">0</b><span>replies in total</span></div>
    <div class="stat"><b id="s-today">0</b><span>posted today (limit 190)</span></div>
    <div class="stat"><b id="s-auto">0</b><span>automatic link replies</span></div>
    <div class="stat hand"><b id="s-hand">0</b><span>hand-written answers</span></div>
  </section>

  <div class="tools">
    <div class="seg" role="group" aria-label="Show">
      <button id="f-all" data-f="all" aria-pressed="true">All</button>
      <button id="f-hand" data-f="hand-written" aria-pressed="false">Hand-written</button>
      <button id="f-auto" data-f="auto" aria-pressed="false">Automatic</button>
    </div>
    <input id="q" type="search" placeholder="Search a name, comment or reply" aria-label="Search">
    <span class="count" id="count"></span>
  </div>

  <section class="log" id="log" aria-live="polite"></section>
</div>

<script>
const ROWS = __DATA__;
const $ = id => document.getElementById(id);
const istToday = new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
$("s-total").textContent = ROWS.length;
$("s-today").textContent = ROWS.filter(r => r.posted_ist.startsWith(istToday)).length;
$("s-auto").textContent = ROWS.filter(r => r.type === "auto").length;
$("s-hand").textContent = ROWS.filter(r => r.type === "hand-written").length;

let filter = "all";
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function render() {
  const q = $("q").value.trim().toLowerCase();
  const shown = ROWS.slice().reverse().filter(r =>
    (filter === "all" || r.type === filter) &&
    (!q || (r.commenter + " " + r.comment + " " + r.our_reply).toLowerCase().includes(q)));
  const log = $("log"); log.replaceChildren();
  for (const r of shown) {
    const row = el("article", "row");
    const when = el("div", "when");
    when.append(el("span", null, r.posted_ist.slice(5).replace("-", "/")),
                el("span", "pill" + (r.type === "auto" ? "" : " hand"), r.type === "auto" ? "Auto" : "Hand-written"));
    const them = el("div");
    them.append(el("div", "who", r.commenter), el("div", "vid", r.video), el("p", "text", r.comment));
    const ours = el("div", "reply");
    const a = el("a", null, "Open on YouTube ↗"); a.href = r.link; a.target = "_blank"; a.rel = "noopener";
    ours.append(el("p", "text", r.our_reply), a);
    row.append(when, them, ours); log.append(row);
  }
  if (!shown.length) log.append(el("div", "empty", "No replies match. Clear the search or pick All."));
  $("count").textContent = shown.length + " of " + ROWS.length;
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));
$("q").addEventListener("input", render);
render();
</script>
</body>
</html>
